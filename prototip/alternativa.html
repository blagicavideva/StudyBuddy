<!doctype html>
<html lang="sl">
  <head>
    <meta charset="utf-8" />
    <title>StudyBuddy — Alternativni prototip</title>
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        box-sizing: border-box;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        --out: #dcd9f0;
        --bg: #f4f3fa;
        --card: #fff;
        --ink: #1b1840;
        --mut: #6b6890;
        --pri: #4b3fc4;
        --pri2: #2a2470;
        --teal: #1e9c8f;
        --cor: #ff7a66;
        --yel: #f2b134;
        --line: #e4e2f2;
        --soft: #eceafb;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --out: #0b0a1e;
          --bg: #14122f;
          --card: #1e1b45;
          --ink: #eeedfb;
          --mut: #a9a6d0;
          --pri: #6f62f0;
          --teal: #35c4b5;
          --line: #2e2a5e;
          --soft: #2a2660;
        }
      }
      :root[data-theme="dark"] {
        --out: #0b0a1e;
        --bg: #14122f;
        --card: #1e1b45;
        --ink: #eeedfb;
        --mut: #a9a6d0;
        --pri: #6f62f0;
        --teal: #35c4b5;
        --line: #2e2a5e;
        --soft: #2a2660;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html {
        scroll-padding-top: env(safe-area-inset-top, 0px);
      }
      html,
      body {
        height: 100%;
      }
      body {
        font:
          14px/1.45 Manrope,
          system-ui,
          sans-serif;
        background: var(--out);
        color: var(--ink);
        display: flex;
        justify-content: center;
      }
      #ph {
        width: 100%;
        max-width: 430px;
        height: 100%;
        display: flex;
        flex-direction: column;
        background: var(--bg);
        position: relative;
        overflow: hidden;
      }
      @media (min-width: 500px) {
        #ph {
          height: min(100%, 860px);
          margin: auto;
          border-radius: 28px;
          box-shadow: 0 20px 60px rgba(20, 16, 70, 0.3);
        }
      }
      #scr {
        flex: 1;
        overflow-y: auto;
        padding: 0 16px 20px;
      }
      #nav {
        display: flex;
        background: var(--card);
        border-top: 1px solid var(--line);
      }
      #nav button {
        flex: 1;
        border: 0;
        background: none;
        color: var(--mut);
        padding: 9px 0 7px;
        font:
          600 11px Manrope,
          sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        cursor: pointer;
      }
      #nav button.on {
        color: var(--pri);
      }
      .i {
        width: 22px;
        height: 22px;
      }
      button {
        font-family: inherit;
        color: inherit;
      }
      .hd {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 18px 0 12px;
      }
      .hd h1 {
        flex: 1;
        font-size: 22px;
        font-weight: 800;
      }
      .ic {
        width: 38px;
        height: 38px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: var(--card);
        display: grid;
        place-items: center;
        cursor: pointer;
        position: relative;
      }
      .dot {
        position: absolute;
        top: 7px;
        right: 8px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--cor);
      }
      .c {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 14px;
        margin-bottom: 10px;
      }
      .row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .mut {
        color: var(--mut);
      }
      small,
      .sm {
        font-size: 12px;
      }
      .mt {
        margin-top: 6px;
      }
      .fx {
        flex: 1;
      }
      .b {
        background: var(--pri);
        color: #fff;
        border: 0;
        border-radius: 12px;
        padding: 12px 16px;
        font-weight: 700;
        cursor: pointer;
        width: 100%;
        font-size: 14px;
        margin-top: 6px;
      }
      .b2 {
        background: transparent;
        color: var(--ink);
        border: 1px solid var(--line);
      }
      .bs {
        width: auto;
        padding: 7px 12px;
        margin: 0;
        font-size: 12px;
      }
      .in {
        width: 100%;
        padding: 11px 12px;
        border: 1px solid var(--line);
        border-radius: 12px;
        background: var(--card);
        color: var(--ink);
        font: inherit;
        margin-top: 4px;
      }
      label {
        display: block;
        font-weight: 600;
        font-size: 12px;
        color: var(--mut);
        margin-top: 10px;
      }
      .hero {
        background: linear-gradient(150deg, var(--pri2), var(--pri));
        color: #fff;
        margin: 0 -16px;
        padding: calc(20px) 16px 22px;
        border-radius: 0 0 26px 26px;
      }
      .hero .ic {
        background: rgba(255, 255, 255, 0.14);
        border: 0;
        color: #fff;
      }
      .hero h1 {
        font-size: 26px;
        font-weight: 800;
      }
      .av {
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: inline-grid;
        place-items: center;
        color: #fff;
        font-weight: 800;
        font-size: 12px;
        flex: none;
        border: 2px solid var(--card);
      }
      .avs .av {
        margin-left: -8px;
      }
      .avs .av:first-child {
        margin-left: 0;
      }
      .tag {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        font-size: 11px;
        font-weight: 700;
        padding: 3px 9px;
        border-radius: 99px;
        background: var(--soft);
      }
      .tag i {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      .chips {
        display: flex;
        gap: 8px;
        overflow-x: auto;
        padding: 2px 0 10px;
      }
      .chip {
        flex: none;
        border: 1px solid var(--line);
        background: var(--card);
        border-radius: 99px;
        padding: 6px 13px;
        font-weight: 600;
        font-size: 12px;
        cursor: pointer;
      }
      .chip.on {
        background: var(--pri);
        color: #fff;
        border-color: var(--pri);
      }
      .sc {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 10px;
        margin: 16px 0;
      }
      .sc button {
        background: var(--card);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 12px 4px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 6px;
        font-weight: 700;
        font-size: 11px;
        cursor: pointer;
      }
      .sc .i {
        color: var(--pri);
      }
      h2 {
        font-size: 15px;
        font-weight: 800;
        margin: 16px 0 8px;
      }
      .hs {
        display: flex;
        gap: 10px;
        overflow-x: auto;
        margin: 0 -16px;
        padding: 0 16px 4px;
      }
      .hs .c {
        flex: none;
        width: 200px;
        margin: 0;
        cursor: pointer;
      }
      .ev {
        display: flex;
        gap: 12px;
        align-items: center;
      }
      .dt {
        flex: none;
        width: 46px;
        text-align: center;
        background: var(--soft);
        border-radius: 12px;
        padding: 6px 0;
        font-size: 11px;
        font-weight: 700;
      }
      .dt b {
        display: block;
        font-size: 18px;
        line-height: 1.1;
      }
      .pv {
        border-left: 3px solid var(--teal);
      }
      .gv {
        border-left: 3px solid var(--pri);
      }
      .tabs {
        display: flex;
        gap: 4px;
        overflow-x: auto;
        border-bottom: 1px solid var(--line);
        margin: 0 -16px 12px;
        padding: 0 16px;
      }
      .tabs button {
        flex: none;
        border: 0;
        background: none;
        padding: 10px 8px;
        font-weight: 700;
        color: var(--mut);
        border-bottom: 3px solid transparent;
        cursor: pointer;
      }
      .tabs .on {
        color: var(--pri);
        border-color: var(--pri);
      }
      .cal {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
        text-align: center;
      }
      .cal span {
        font-size: 11px;
        color: var(--mut);
        font-weight: 700;
      }
      .cal button {
        aspect-ratio: 1;
        border: 0;
        border-radius: 12px;
        background: none;
        font-weight: 600;
        cursor: pointer;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
      }
      .cal .tdy {
        border: 1.5px solid var(--pri);
      }
      .cal .on {
        background: var(--pri);
        color: #fff;
      }
      .cal em {
        display: flex;
        gap: 3px;
        height: 5px;
      }
      .cal em i {
        width: 5px;
        height: 5px;
        border-radius: 50%;
      }
      .bar {
        height: 8px;
        background: var(--soft);
        border-radius: 9px;
        overflow: hidden;
      }
      .bar i {
        display: block;
        height: 100%;
        background: var(--teal);
      }
      .bub {
        max-width: 80%;
        padding: 9px 12px;
        border-radius: 16px 16px 16px 4px;
        background: var(--card);
        border: 1px solid var(--line);
      }
      .me {
        margin-left: auto;
        background: var(--pri);
        color: #fff;
        border-radius: 16px 16px 4px 16px;
        border: 0;
      }
      .cin {
        position: sticky;
        bottom: -20px;
        display: flex;
        gap: 8px;
        background: var(--bg);
        padding: 10px 0;
      }
      .chk {
        width: 24px;
        height: 24px;
        border-radius: 8px;
        border: 2px solid var(--line);
        display: grid;
        place-items: center;
        flex: none;
        cursor: pointer;
        background: none;
        color: #fff;
      }
      .chk.on {
        background: var(--teal);
        border-color: var(--teal);
      }
      .emp {
        text-align: center;
        padding: 26px 10px;
        color: var(--mut);
      }
      .emp b {
        display: block;
        color: var(--ink);
        margin-bottom: 2px;
      }
      .ov {
        position: absolute;
        inset: 0;
        background: rgba(15, 12, 50, 0.5);
        display: flex;
        align-items: flex-end;
        z-index: 5;
      }
      .sh {
        background: var(--bg);
        width: 100%;
        max-height: 88%;
        overflow-y: auto;
        border-radius: 24px 24px 0 0;
        padding: 18px 16px 22px;
      }
      #toast {
        position: absolute;
        left: 16px;
        right: 16px;
        bottom: 84px;
        background: var(--pri2);
        color: #fff;
        padding: 12px 14px;
        border-radius: 14px;
        font-weight: 600;
        z-index: 9;
        opacity: 0;
        pointer-events: none;
        transition: opacity 0.25s;
      }
      #toast.on {
        opacity: 1;
      }
      .ring {
        display: block;
        margin: 10px auto;
      }
      .tg {
        width: 44px;
        height: 26px;
        border-radius: 99px;
        background: var(--line);
        border: 0;
        position: relative;
        cursor: pointer;
      }
      .tg:after {
        content: "";
        position: absolute;
        top: 3px;
        left: 3px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #fff;
        transition: left 0.2s;
      }
      .tg.on {
        background: var(--teal);
      }
      .tg.on:after {
        left: 21px;
      }
      .seg {
        display: flex;
        background: var(--soft);
        border-radius: 12px;
        padding: 3px;
      }
      .seg button {
        flex: 1;
        border: 0;
        background: none;
        padding: 8px;
        border-radius: 10px;
        font-weight: 700;
        cursor: pointer;
      }
      .seg .on {
        background: var(--pri);
        color: #fff;
      }
      .login {
        padding-top: 48px;
      }
      .logo {
        width: 56px;
        height: 56px;
        border-radius: 18px;
        background: linear-gradient(140deg, var(--pri), var(--teal));
        display: grid;
        place-items: center;
        color: #fff;
        font-weight: 800;
        font-size: 26px;
      }
    </style>
    <style>
      :root {
        --out: #e7e6df;
        --bg: #f7f7f2;
        --card: #fff;
        --ink: #202b2a;
        --mut: #71807b;
        --pri: #19745f;
        --pri2: #104b42;
        --teal: #d5a83c;
        --cor: #cf6d50;
        --yel: #e9c56a;
        --line: #e2e5dc;
        --soft: #edf3ee;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --out: #101a18;
          --bg: #172320;
          --card: #202e2a;
          --ink: #eff3ed;
          --mut: #a6b4ac;
          --pri: #62b89c;
          --pri2: #275b4d;
          --teal: #e0bf65;
          --line: #34453f;
          --soft: #293a34;
        }
      }
      :root[data-theme="dark"] {
        --out: #101a18;
        --bg: #172320;
        --card: #202e2a;
        --ink: #eff3ed;
        --mut: #a6b4ac;
        --pri: #62b89c;
        --pri2: #275b4d;
        --teal: #e0bf65;
        --line: #34453f;
        --soft: #293a34;
      }
      body {
        font-family: "Aptos", "Segoe UI", system-ui, sans-serif;
        background: var(--out);
      }
      #ph {
        background: var(--bg);
      }
      @media (min-width: 500px) {
        #ph {
          border-radius: 20px;
          box-shadow: 0 18px 55px rgba(25, 45, 38, 0.18);
        }
      }
      #scr {
        padding-left: 20px;
        padding-right: 20px;
      }
      #nav {
        padding: 5px 8px calc(5px + env(safe-area-inset-bottom, 0px));
        gap: 3px;
      }
      #nav button {
        border-radius: 12px;
        padding: 8px 0 6px;
        transition:
          background 0.18s,
          color 0.18s;
      }
      #nav button.on {
        background: var(--soft);
      }
      .hd {
        padding-top: 20px;
      }
      .hd h1,
      .hero h1 {
        letter-spacing: -0.035em;
      }
      .ic {
        border-radius: 50%;
        border-color: transparent;
        background: var(--soft);
      }
      .c {
        border-radius: 12px;
        border-color: var(--line);
        box-shadow: 0 2px 8px rgba(27, 51, 41, 0.035);
      }
      .hero {
        background: linear-gradient(135deg, #124d43, #26755f);
        border-radius: 0 0 20px 20px;
        padding-top: 24px;
      }
      .hero .ic {
        border-radius: 12px;
        background: rgba(255, 255, 255, 0.15);
      }
      .b {
        border-radius: 10px;
        background: var(--pri);
      }
      .b2 {
        background: transparent;
      }
      .b2:hover,
      .ic:hover,
      .chip:hover {
        background: var(--soft);
      }
      .in {
        border-radius: 10px;
      }
      .chip {
        border-radius: 10px;
      }
      .chip.on {
        background: var(--pri);
      }
      .tag {
        border-radius: 7px;
        background: var(--soft);
      }
      .dt {
        border-radius: 10px;
      }
      .tabs button {
        padding-left: 10px;
        padding-right: 10px;
      }
      .av {
        border: 2px solid var(--card);
      }
      @media (min-width: 500px) {
        #ph {
          max-width: 430px;
        }
      }
    </style>
  </head>
  <body>
    <div id="ph">
      <div id="scr"></div>
      <div id="nav"></div>
      <div id="toast"></div>
    </div>
    <script>
      const $ = (s) => document.querySelector(s);
      const TR = {
        Domov: "Home",
        Skupine: "Groups",
        Koledar: "Calendar",
        Profil: "Profile",
        Klepet: "Chat",
        "Prihajajoče obveznosti": "Upcoming",
        "Moje skupine": "My groups",
        "Odkrij skupine": "Discover groups",
        "Ustvari skupino": "Create group",
        "Pridruži se s kodo ali povabilom": "Join with code or invite",
        "Pridruži se": "Join",
        "Dodaj dogodek": "Add event",
        Osebno: "Private",
        Začni: "Start",
        Premor: "Pause",
        Ponastavi: "Reset",
        "Čas za učenje": "Focus time",
        "Čas za odmor": "Break time",
        Objave: "Posts",
        Gradiva: "Materials",
        Dogodki: "Events",
        Opravila: "Tasks",
        Vprašanja: "Questions",
        Prijava: "Log in",
        Registracija: "Sign up",
        "Jezik aplikacije": "App language",
        Obvestila: "Notifications",
        Odjava: "Log out",
        "Osebni zapiski": "Personal notes",
        "Shranjena gradiva": "Saved materials",
        Predmeti: "Subjects",
        Uredi: "Edit",
        "Išči skupine": "Search groups",
        Vse: "All",
        "Najdi partnerja za učenje": "Find a study partner",
        Živjo: "Hi",
        "Nova objava": "New post",
        "Dodaj gradivo": "Add material",
        "Nov termin": "New session",
        "Nova anketa": "New poll",
        "Nova naloga": "New task",
        "Novo vprašanje": "New question",
        "Skupni napredek": "Team progress",
        "Samo vi": "Only you",
        "Skupinski termin": "Group session",
        "Pišite sporočilo…": "Write a message…",
        Prekliči: "Cancel",
        Objavi: "Post",
        Shrani: "Save",
        "Ime in priimek": "Full name",
        Fakulteta: "Faculty",
        Smer: "Programme",
        Letnik: "Year",
        "E-pošta": "Email",
        Geslo: "Password",
        "Ustvari račun": "Create account",
        "Še nimate računa? Registrirajte se": "No account? Sign up",
        "Že imate račun? Prijavite se": "Have an account? Log in",
        "Obvestila o sporočilih": "Message alerts",
        "Opomniki za roke": "Deadline reminders",
        Kmalu: "Soon",
        "Mednarodne učne sobe": "International study rooms",
        Tutorji: "Tutors",
        "Učne sobe": "Study rooms",
        "Zasebna sporočila": "Private messages",
        "Pomodoro časovnik": "Pomodoro timer",
        Poišči: "Search",
        Povabi: "Invite",
        Naslov: "Title",
        Datum: "Date",
        Ura: "Time",
        Opis: "Description",
        Opomnik: "Reminder",
        Lokacija: "Location",
        Vrsta: "Type",
        Anketa: "Poll",
        Odgovori: "Answer",
        Nazaj: "Back",
      };
      const T = (s) => (S.lang == "en" && TR[s]) || s;
      const P = {
        home: '<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
        users:
          '<circle cx="9" cy="8" r="3.5"/><path d="M2 20c0-3.500 3-6 7-6s7 2.500 7 6M16 4.500a3.500 3.500 0 0 1 0 7M18 14.500c2.500.7 4 2.800 4 5.500"/>',
        cal: '<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>',
        user: '<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 3.500-6 8-6s8 2 8 6"/>',
        bell: '<path d="M6 16v-5a6 6 0 0 1 12 0v5l2 2H4zM10 21h4"/>',
        clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
        plus: '<path d="M12 5v14M5 12h14"/>',
        search: '<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
        send: '<path d="M22 2L11 13M22 2l-7 20-4-9-9-4z"/>',
        lock: '<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>',
        bm: '<path d="M6 3h12v18l-6-4-6 4z"/>',
        chat: '<path d="M21 12a8 8 0 0 1-11.500 7.200L3 21l1.800-6A8 8 0 1 1 21 12z"/>',
        file: '<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/>',
        link: '<path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/>',
        img: '<rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="2"/><path d="M21 16l-5-5-9 9"/>',
        check: '<path d="M5 12l5 5 9-10"/>',
        back: '<path d="M15 5l-7 7 7 7"/>',
        pin: '<path d="M12 21s7-6 7-12a7 7 0 0 0-14 0c0 6 7 12 7 12z"/><circle cx="12" cy="9" r="2.500"/>',
        note: '<path d="M4 4h16v12l-4 4H4z"/><path d="M16 20v-4h4"/>',
      };

<div class='seg' style='margin-top:20px'><button class='${r ? "" : "on"}' onclick="keep();S.auth='login';R()">${T("Prijava")}</button><button class='${r ? "on" : ""}' onclick="keep();S.auth='reg';R()">${T("Registracija")}</button></div>
${r ? `<label>Vrsta računa</label><div class='seg'><button class='${t ? "" : "on"}' onclick="keep();S.rr='student';R()">Študent</button><button class='${t ? "on" : ""}' onclick="keep();S.rr='tutor';R()">Tutor</button></div><label>Ime in priimek</label><input class='in' id='rn' placeholder='Ana Novak' value='${f.rn || ""}'>${t ? `<label>Področje študija / strokovno področje</label><input class='in' id='rfd' placeholder='Npr. Računalništvo in informatika' value='${f.rfd || ""}'>` : `<label>Fakulteta</label><input class='in' id='rf' value='${f.rf || "FERI, Univerza v Mariboru"}'><label>Smer</label><input class='in' id='rs' value='${f.rs || "Računalništvo"}'><label>Letnik</label><select class='in' id='rl'>${["1. letnik", "2. letnik", "3. letnik", "Magistrij"].map((x) => `<option ${x == (f.rl || "2. letnik") ? "selected" : ""}>${x}</option>`).join("")}</select>`}` : ""}
<label>E-pošta</label><input class='in' id='em' type='email' placeholder='ime.priimek@student.um.si' value='${f.em || ""}'><label>Geslo</label><input class='in' id='pw' type='password' placeholder='••••••••' value='${f.pw || ""}'><p id='er' class='sm' style='color:var(--cor);min-height:18px;margin-top:6px'></p>
<button class='b' onclick='doAuth()'>${r ? (t ? "Naprej" : T("Ustvari račun")) : T("Prijava")}</button>
${r ? "" : `<p class='sm mut' style='margin-top:14px'>Demo računa (geslo: geslo123):<br>ana.novak@student.um.si – študent<br>tina.kovac@student.um.si – tutor</p>`}</div>`;
      }
      function enter(e) {
        const a = S.acc[e];
        S.role = a.role;
        S.f = {};
        S.dm = a.role == "tutor" ? S.dmT : S.dmS;
        if (a.role == "tutor") {
          S.tutor = a.prof;
          if (!S.rooms.some((r) => r.m.includes(S.tutor.n)))
            S.rooms.push({
              id: Date.now(),
              n: "Konzultacije: " + (S.tutor.s[0] || "Predmet"),
              s: S.tutor.s[0] || "Matematika",
              w: "Na daljavo",
              open: 1,
              intl: 0,
              m: [S.tutor.n, "Ana", "Žan"],
              msgs: [
                { by: "Žan", t: "Pozdravljeni, začnemo ob 17:00?", h: "16:40" },
              ],
            });
          go("thome", "thome");
        } else {
          S.user = a.user;
          go("home", "home");
        }
      }
      function doAuth() {
        const e = $("#em").value.trim().toLowerCase(),
          p = $("#pw").value,
          er = (m) => ($("#er").textContent = m);
        if (!e.includes("@") || p.length < 4) {
          er("Vnesite veljaven e-poštni naslov in geslo (vsaj 4 znake).");
          return;
        }
        if (S.auth == "login") {
          const a = S.acc[e];
          if (!a) {
            er("Za ta e-poštni naslov računa ni. Ustvarite račun.");
            return;
          }
          if (a.pw != p) {
            er("Napačno geslo.");
            return;
          }
          enter(e);
          return;
        }
        const n = $("#rn").value.trim();
        if (!n) {
          er("Vnesite ime in priimek.");
          return;
        }
        if (S.acc[e]) {
          er("Račun s tem naslovom že obstaja. Prijavite se.");
          return;
        }
        if (S.rr == "tutor") {
          S.pend = { e, p, n, fd: ($("#rfd").value || "").trim() };
          S.tph = "";
          go("tsetup");
          return;
        }
        S.acc[e] = {
          role: "student",
          pw: p,
          user: {
            name: n,
            fac: $("#rf").value,
            smer: $("#rs").value,
            let: $("#rl").value,
            subj: ["Programiranje 1", "Podatkovne baze", "Matematika"],
          },
        };
        toast("Račun je ustvarjen. Dobrodošli v StudyBuddy!");
        enter(e);
      }
      function TSetup() {
        return (
          hd("Profil tutorja", "login") +
          `<div class='sm mut' style='margin:-6px 0 10px'>Korak 2 od 2 · ${S.pend.n}</div><div class='c'><label style='margin-top:0'>Profilna fotografija</label><div class='row'><div id='pp'>${avp({ n: S.pend.n, ph: S.tph })}</div><input type='file' accept='image/*' onchange='phSel(this)' class='fx sm'></div><label>Predmeti, pri katerih nudite pomoč (ločeno z vejico)</label><input class='in' id='rsu' placeholder='Programiranje 1, Podatkovne baze'><label>Jeziki</label><input class='in' id='rjz' value='Slovenščina, English'><label>Način izvajanja učnih ur</label><select class='in' id='rmd'><option>V živo in na daljavo</option><option>V živo</option><option>Na daljavo</option></select><label>Kratek opis izkušenj</label><textarea class='in' id='rb' rows='3' placeholder='Npr. tutor že 2 leti, razlagam SQL in osnove programiranja.'></textarea><p id='er' class='sm' style='color:var(--cor);min-height:18px;margin-top:6px'></p><button class='b' onclick='finishT()'>Ustvari profil</button></div>`
        );
      }
      function finishT() {
        const sb = $("#rsu")
          .value.split(",")
          .map((x) => x.trim())
          .filter(Boolean);
        if (!sb.length) {
          $("#er").textContent = "Dodajte vsaj en predmet.";
          return;
        }
        const d = S.pend,
          pr = {
            n: d.n,
            fd: d.fd,
            ph: S.tph,
            s: sb,
            j: $("#rjz").value,
            md: $("#rmd").value,
            b: $("#rb").value || "Tutor na platformi StudyBuddy.",
          };
        S.acc[d.e] = { role: "tutor", pw: d.p, prof: pr };
        TU.unshift({
          n: pr.n,
          l: (pr.fd || "Tutor") + " · " + pr.md,
          r: "novo",
          s: sb,
        });
        S.tph = "";
        S.pend = null;
        toast("Profil tutorja je ustvarjen.");
        enter(d.e);
      }
      function setL(l) {
        S.lang = l;
        R();
        toast(
          l == "en"
            ? "Language changed to English."
            : "Jezik je nastavljen na slovenščino.",
        );
      }
      function editP() {
        const u = S.user;
        sheet(
          "Uredi",
          [
            { id: "n", l: "Ime in priimek", v: u.name },
            { id: "f", l: "Fakulteta", v: u.fac },
            { id: "s", l: "Smer", v: u.smer },
            {
              id: "l",
              l: "Letnik",
              t: "sel",
              o: ["1. letnik", "2. letnik", "3. letnik", "Magistrij"],
              v: u.let,
            },
          ],
          "Shrani",
          (v) => {
            Object.assign(u, {
              name: v.n || u.name,
              fac: v.f,
              smer: v.s,
              let: v.l,
            });
            toast("Profil je posodobljen.");
          },
        );
      }
      function addSubj() {
        sheet(
          "Predmeti",
          [
            {
              id: "s",
              l: "Predmet",
              t: "sel",
              o: ["Calculus", "Algoritmi", "Fizika", "Statistika"],
            },
          ],
          "Shrani",
          (v) => {
            if (!S.user.subj.includes(v.s)) S.user.subj.push(v.s);
          },
        );
      }
      function addNote() {
        sheet(
          "Osebni zapiski",
          [{ id: "t", l: "Zapisek", t: "area" }],
          "Shrani",
          (v) => {
            if (!v.t) return false;
            S.notes.unshift(v.t);
            toast("Zapisek je shranjen.");
          },
        );
      }
      R();
    </script>
  </body>
</html>
